AWSTemplateFormatVersion: '2010-09-09'
Description: 'VPC con subredes públicas y privadas en dos zonas de disponibilidad, y una instancia Ubuntu con WordPress, Systems Manager y CloudWatch.'

Parameters:
  NN:
    Type: String
    Default: '01'
    Description: 'Identificador numérico de dos dígitos para personalizar el CIDR y las etiquetas (ej. 01).'
    AllowedPattern: '^\d{2}$'
  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: '/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id'
    Description: 'Parametro publico de Systems Manager con la AMI Ubuntu 24.04 LTS para arquitectura x86_64. (ami-03a76c59524b2c1e9)'
  InstanceType:
    Type: String
    Default: 't3.micro'
    Description: 'Tipo de instancia EC2 compatible con la AMI x86_64.'
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
  WebAccessCidr:
    Type: String
    Default: '0.0.0.0/0'
    Description: 'Rango IPv4 autorizado a acceder a WordPress por HTTP. Restringelo, especialmente durante la instalacion.'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: 'Introduce un bloque CIDR IPv4, por ejemplo 203.0.113.0/24.'

Resources:
  # 1. VPC con IPv4 personalizado (Sin propiedades IPv6 aquí)
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Sub '10.1${NN}.0.0/16'
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-VPC'

  # 1.1. Recurso independiente para asociar el bloque IPv6 de AWS a la VPC
  VPCIPv6CidrBlock:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      VpcId: !Ref VPC
      AmazonProvidedIpv6CidrBlock: true

  # 2. Internet Gateway (IGW)
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-IGW'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # 3. Egress-Only Internet Gateway (EIGW) para IPv6 privado
  EgressOnlyInternetGateway:
    Type: AWS::EC2::EgressOnlyInternetGateway
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-EIGW'

  # 4. Subredes públicas y privadas (/24) en dos zonas de disponibilidad
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    DependsOn: VPCIPv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Sub '10.1${NN}.1.0/24'
      AvailabilityZone: !Select [0, !GetAZs '']
      Ipv6CidrBlock: !Select
        - 0
        - !Cidr
          - !Select [0, !GetAtt VPC.Ipv6CidrBlocks]
          - 4
          - 64
      MapPublicIpOnLaunch: true
      AssignIpv6AddressOnCreation: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-PublicSubnet1'

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    DependsOn: VPCIPv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Sub '10.1${NN}.2.0/24'
      AvailabilityZone: !Select [0, !GetAZs '']
      Ipv6CidrBlock: !Select
        - 1
        - !Cidr
          - !Select [0, !GetAtt VPC.Ipv6CidrBlocks]
          - 4
          - 64
      AssignIpv6AddressOnCreation: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-PrivateSubnet1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    DependsOn: VPCIPv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Sub '10.1${NN}.3.0/24'
      AvailabilityZone: !Select [1, !GetAZs '']
      Ipv6CidrBlock: !Select
        - 2
        - !Cidr
          - !Select [0, !GetAtt VPC.Ipv6CidrBlocks]
          - 4
          - 64
      MapPublicIpOnLaunch: true
      AssignIpv6AddressOnCreation: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-PublicSubnet2'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    DependsOn: VPCIPv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Sub '10.1${NN}.4.0/24'
      AvailabilityZone: !Select [1, !GetAZs '']
      Ipv6CidrBlock: !Select
        - 3
        - !Cidr
          - !Select [0, !GetAtt VPC.Ipv6CidrBlocks]
          - 4
          - 64
      AssignIpv6AddressOnCreation: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-PrivateSubnet2'

  # 6. Tabla de Enrutamiento Pública
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-PublicRouteTable'

  PublicRouteIPv4:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  PublicRouteIPv6:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationIpv6CidrBlock: '::/0'
      GatewayId: !Ref InternetGateway

  # 7. Tabla de Enrutamiento Privada
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-PrivateRouteTable'

  PrivateRouteIPv6:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationIpv6CidrBlock: '::/0'
      EgressOnlyInternetGatewayId: !Ref EgressOnlyInternetGateway

  # 8. Asociaciones de Tablas de Enrutamiento
  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # 9. Acceso web, permisos y registros de la instancia
  WordPressSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Acceso HTTP a WordPress; administracion mediante Systems Manager.'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref WebAccessCidr
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-WordPress-SG'

  WordPressLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  # 10. Ubuntu con el contenido de userdata_cloudwatch_systemmanager_Wordpress.sh
  WordPressInstance1:
    Type: AWS::EC2::Instance
    DependsOn:
      - PublicRouteIPv4
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: LabInstanceProfile
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref WordPressSecurityGroup
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 12
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-WordPress1'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          apt-get update -y
          apt-get upgrade -y

          # Las AMI oficiales de Ubuntu pueden incluir ya el agente de SSM.
          if ! snap list amazon-ssm-agent >/dev/null 2>&1; then
            snap install amazon-ssm-agent --classic
          fi
          systemctl enable --now snap.amazon-ssm-agent.amazon-ssm-agent.service

          apt-get install -y rsyslog apache2 php php-common libapache2-mod-php php-bz2 php-gd php-mysql \
            php-curl php-mbstring php-imagick php-zip php-xml php-json php-bcmath php-intl \
            php-gmp zip unzip wget
          a2enmod env rewrite dir mime headers setenvif ssl
          systemctl enable --now rsyslog
          systemctl enable --now apache2
          systemctl restart apache2

          # WordPress necesita una base de datos externa configurada durante la instalación.
          cd /home/ubuntu
          rm -f /var/www/html/index.html
          wget https://wordpress.org/latest.zip -O latest.zip
          unzip -q latest.zip
          cp -R wordpress/. /var/www/html/
          rm latest.zip
          rm -r wordpress
          chown -R www-data:www-data /var/www/html/

          wget https://amazoncloudwatch-agent.s3.amazonaws.com/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb \
            -O /tmp/amazon-cloudwatch-agent.deb
          dpkg -i /tmp/amazon-cloudwatch-agent.deb
          cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<'EOF'
          {
            "agent": {
              "region": "${AWS::Region}"
            },
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/var/log/syslog",
                      "log_group_name": "${WordPressLogGroup}",
                      "log_stream_name": "{instance_id}-syslog",
                      "timezone": "UTC"
                    },
                    {
                      "file_path": "/var/log/apache2/access.log",
                      "log_group_name": "${WordPressLogGroup}",
                      "log_stream_name": "{instance_id}-apache-access",
                      "timezone": "UTC"
                    },
                    {
                      "file_path": "/var/log/apache2/error.log",
                      "log_group_name": "${WordPressLogGroup}",
                      "log_stream_name": "{instance_id}-apache-error",
                      "timezone": "UTC"
                    }
                  ]
                }
              }
            }
          }
          EOF
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
            -a fetch-config -m ec2 \
            -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s
          systemctl enable amazon-cloudwatch-agent

  WordPressInstance2:
    Type: AWS::EC2::Instance
    DependsOn:
      - PublicRouteIPv4
      - PublicSubnet2RouteTableAssociation
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: LabInstanceProfile
      SubnetId: !Ref PublicSubnet2
      SecurityGroupIds:
        - !Ref WordPressSecurityGroup
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 12
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-WordPress2'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          apt-get update -y
          apt-get upgrade -y

          # Las AMI oficiales de Ubuntu pueden incluir ya el agente de SSM.
          if ! snap list amazon-ssm-agent >/dev/null 2>&1; then
            snap install amazon-ssm-agent --classic
          fi
          systemctl enable --now snap.amazon-ssm-agent.amazon-ssm-agent.service

          apt-get install -y rsyslog apache2 php php-common libapache2-mod-php php-bz2 php-gd php-mysql \
            php-curl php-mbstring php-imagick php-zip php-xml php-json php-bcmath php-intl \
            php-gmp zip unzip wget
          a2enmod env rewrite dir mime headers setenvif ssl
          systemctl enable --now rsyslog
          systemctl enable --now apache2
          systemctl restart apache2

          # WordPress necesita una base de datos externa configurada durante la instalación.
          cd /home/ubuntu
          rm -f /var/www/html/index.html
          wget https://wordpress.org/latest.zip -O latest.zip
          unzip -q latest.zip
          cp -R wordpress/. /var/www/html/
          rm latest.zip
          rm -r wordpress
          chown -R www-data:www-data /var/www/html/

          wget https://amazoncloudwatch-agent.s3.amazonaws.com/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb \
            -O /tmp/amazon-cloudwatch-agent.deb
          dpkg -i /tmp/amazon-cloudwatch-agent.deb
          cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<'EOF'
          {
            "agent": {
              "region": "${AWS::Region}"
            },
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/var/log/syslog",
                      "log_group_name": "${WordPressLogGroup}",
                      "log_stream_name": "{instance_id}",
                      "timezone": "UTC"
                    },
                    {
                      "file_path": "/var/log/apache2/access.log",
                      "log_group_name": "${WordPressLogGroup}",
                      "log_stream_name": "{instance_id}-apache-access",
                      "timezone": "UTC"
                    },
                    {
                      "file_path": "/var/log/apache2/error.log",
                      "log_group_name": "${WordPressLogGroup}",
                      "log_stream_name": "{instance_id}-apache-error",
                      "timezone": "UTC"
                    }
                  ]
                }
              }
            }
          }
          EOF
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
            -a fetch-config -m ec2 \
            -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s
          systemctl enable amazon-cloudwatch-agent

Outputs:
  VpcId:
    Description: 'ID de la VPC'
    Value: !Ref VPC
  PublicSubnet1Id:
    Description: 'ID de la subred pública 1'
    Value: !Ref PublicSubnet1
  PrivateSubnet1Id:
    Description: 'ID de la subred privada 1'
    Value: !Ref PrivateSubnet1
  PublicSubnet2Id:
    Description: 'ID de la subred pública 2'
    Value: !Ref PublicSubnet2
  PrivateSubnet2Id:
    Description: 'ID de la subred privada 2'
    Value: !Ref PrivateSubnet2
  WordPressInstance1Id:
    Description: 'ID de la instancia para conectarse mediante Systems Manager'
    Value: !Ref WordPressInstance1
  WordPressUrl:
    Description: 'URL HTTP para completar la instalación de WordPress'
    Value: !Sub 'http://${WordPressInstance1.PublicIp}/'
  WordPressInstance2Id:
    Description: 'ID de la segunda instancia para conectarse mediante Systems Manager'
    Value: !Ref WordPressInstance2
  WordPressUrl2:
    Description: 'URL HTTP de la segunda instancia de WordPress'
    Value: !Sub 'http://${WordPressInstance2.PublicIp}/'
  WordPressLogGroupName:
    Description: 'Grupo de CloudWatch Logs de la instancia'
    Value: !Ref WordPressLogGroup