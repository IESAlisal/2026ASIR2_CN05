AWSTemplateFormatVersion: '2010-09-09'
Description: 'VPC con 2 subredes publicas y 2 subredes privadas en dos zonas de disponibilidad y una instancia Ubuntu 26.04 con la aplicacion en cada subred publica.'

Parameters:
  NN:
    Type: String
    Default: '01'
    Description: 'Numero de dos cifras para personalizar el CIDR y las etiquetas (ej. 01).'
    AllowedPattern: '^\d{2}$'
    ConstraintDescription: 'Introduce exactamente dos cifras.'
  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: '/aws/service/canonical/ubuntu/server/26.04/stable/current/amd64/hvm/ebs-gp3/ami-id'
    Description: 'Parametro publico de Systems Manager con la AMI Ubuntu 26.04 LTS x86_64.'
  InstanceType:
    Type: String
    Default: 't3.micro'
    Description: 'Tipo de instancia EC2 compatible con la AMI x86_64.'
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
  WebAccessCidr:
    Type: String
    Default: '0.0.0.0/0'
    Description: 'Rango IPv4 autorizado a acceder a la aplicacion por HTTP.'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: 'Introduce un bloque CIDR IPv4, por ejemplo 203.0.113.0/24.'

Resources:
  # VPC con CIDR IPv4 10.1NN.0.0/16
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Sub '10.1${NN}.0.0/16'
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-VPC'

  # CIDR IPv6 proporcionado por AWS
  VPCIPv6CidrBlock:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      VpcId: !Ref VPC
      AmazonProvidedIpv6CidrBlock: true

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-igw'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  EgressOnlyInternetGateway:
    Type: AWS::EC2::EgressOnlyInternetGateway
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-eigw'

  # Subredes IPv4 /24 e IPv6 /64 en dos zonas de disponibilidad
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    DependsOn: VPCIPv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Sub '10.1${NN}.1.0/24'
      Ipv6CidrBlock: !Select
        - 0
        - !Cidr [!Select [0, !GetAtt VPC.Ipv6CidrBlocks], 4, 64]
      MapPublicIpOnLaunch: true
      AssignIpv6AddressOnCreation: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-PublicSubnet1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    DependsOn: VPCIPv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Sub '10.1${NN}.2.0/24'
      Ipv6CidrBlock: !Select
        - 1
        - !Cidr [!Select [0, !GetAtt VPC.Ipv6CidrBlocks], 4, 64]
      MapPublicIpOnLaunch: true
      AssignIpv6AddressOnCreation: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-PublicSubnet2'

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    DependsOn: VPCIPv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Sub '10.1${NN}.3.0/24'
      Ipv6CidrBlock: !Select
        - 2
        - !Cidr [!Select [0, !GetAtt VPC.Ipv6CidrBlocks], 4, 64]
      AssignIpv6AddressOnCreation: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-PrivateSubnet1'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    DependsOn: VPCIPv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Sub '10.1${NN}.4.0/24'
      Ipv6CidrBlock: !Select
        - 3
        - !Cidr [!Select [0, !GetAtt VPC.Ipv6CidrBlocks], 4, 64]
      AssignIpv6AddressOnCreation: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-PrivateSubnet2'

  # Tabla de enrutamiento publica: IGW para IPv4 e IPv6
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-PublicRouteTable'

  PublicRouteIPv4:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  PublicRouteIPv6:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationIpv6CidrBlock: '::/0'
      GatewayId: !Ref InternetGateway

  # Tabla de enrutamiento privada: EIGW para IPv6
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-PrivateRouteTable'

  PrivateRouteIPv6:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationIpv6CidrBlock: '::/0'
      EgressOnlyInternetGatewayId: !Ref EgressOnlyInternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # Grupo de seguridad compartido por las dos instancias
  AplicacionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Acceso HTTP a la aplicacion; administracion mediante Systems Manager.'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref WebAccessCidr
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-Aplicacion-SG'

  # Sistema de archivos EFS cifrado
  EFSFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      FileSystemTags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-EFS'

  # Grupo de seguridad del EFS: NFS solo desde el grupo de seguridad de las instancias
  EFSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Acceso NFS al EFS desde las instancias de ubuntu'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref AplicacionSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-EFS-SG'

  EFSMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EFSFileSystem
      SubnetId: !Ref PrivateSubnet1
      SecurityGroups:
        - !Ref EFSSecurityGroup

  EFSMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EFSFileSystem
      SubnetId: !Ref PrivateSubnet2
      SecurityGroups:
        - !Ref EFSSecurityGroup

  # Instancias Ubuntu 26.04 con el rol LabRole (perfil de instancia LabInstanceProfile)
  AplicacionInstance1:
    Type: AWS::EC2::Instance
    DependsOn:
      - PublicRouteIPv4
      - PublicSubnet1RouteTableAssociation
      - EFSMountTarget1
      - EFSMountTarget2
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: LabInstanceProfile
      SubnetId: !Ref PublicSubnet1
      PrivateIpAddress: !Sub '10.1${NN}.1.100'
      SecurityGroupIds:
        - !Ref AplicacionSecurityGroup
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 12
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-Aplicacion1'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          apt-get update -y
          apt-get upgrade -y

          # Instalar SSM Agent en Ubuntu
          snap install amazon-ssm-agent --classic
          systemctl enable snap.amazon-ssm-agent.amazon-ssm-agent.service
          systemctl start snap.amazon-ssm-agent.amazon-ssm-agent.service

          apt-get install apache2 nfs-common -y
          apt-get install php php-common libapache2-mod-php php-bz2 php-gd php-mysql \
          php-curl php-mbstring php-imagick php-zip php-common php-curl php-xml \
          php-json php-bcmath php-xml php-intl php-gmp zip unzip wget -y
          a2enmod env rewrite dir mime headers setenvif ssl
          systemctl restart apache2
          systemctl enable apache2

          #Descarga y descomprime la ultima version del Aplicacion
          #Se necesita un RDS para la bbdd
          cd /var/www/html
          rm /var/www/html/index.html
          git clone https://github.com/IESAlisal/SRIDTarea03.git .

          # Montar el EFS en data (compartido entre instancias) de forma persistente
          mkdir -p /var/www/html/data
          echo "${EFSFileSystem}.efs.${AWS::Region}.amazonaws.com:/ /var/www/html/data nfs4 nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport,_netdev 0 0" >> /etc/fstab
          mount -a

          chown -R www-data:www-data /var/www/html/

          # Configurar CloudWatch Logs
          LOG_GROUP="/ec2/ubuntu_app"
          REGION="us-east-1"
          cd /home/ubuntu
          # Instalar CloudWatch Agent  INICIO #############################
          # https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/download-CloudWatch-Agent-on-EC2-Instance-commandline-first.html
          wget https://amazoncloudwatch-agent.s3.amazonaws.com/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb
          dpkg -i amazon-cloudwatch-agent.deb
          rm amazon-cloudwatch-agent.deb
          
          # Crear configuracion del agente
          cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<EOF
          {
            "agent": {
              "region": "$REGION"
            },
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/var/log/syslog",
                      "log_group_name": "$LOG_GROUP",
                      "log_stream_name": "{instance_id}-syslog",
                      "timezone": "UTC"
                    },
                    {
                      "file_path": "/var/log/apache2/access.log",
                      "log_group_name": "$LOG_GROUP",
                      "log_stream_name": "{instance_id}-apache-access",
                      "timezone": "UTC"
                    },
                    {
                      "file_path": "/var/log/apache2/error.log",
                      "log_group_name": "$LOG_GROUP",
                      "log_stream_name": "{instance_id}-apache-error",
                      "timezone": "UTC"
                    }
                  ]
                }
              }
            }
          }
          EOF

          # Iniciar el agente
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
            -a fetch-config \
            -m ec2 \
            -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json \
            -s

          # Habilitar el servicio
          systemctl enable amazon-cloudwatch-agent
          systemctl restart amazon-cloudwatch-agent

          # IMPORTANTE
          # Para que funcione el agente de CloudWatch debes tener conectividad a los endpoints de CloudWatch Logs
          # Si estas en la red publica con IGW no hay problema
          # Si estas en una VPC privada con NAT-GATEWAY tampoco hay problema
          # Si estas en una VPC privada sin salida a Internet debes usar un ENDPOINT VPC
          # Si solo usas IPv6 sin NAT-GATEWAY debes abrir el puerto https ::0 en el grupo de seguridad entrante (y saliente si tienes reglas restrictivas)
          # Parece que da problemas con la resolucion DNS si no tienes IPv4
          # Debes usar un ENDPOINT IPv6 para CloudWatch en tu region (AWS Services y buscar logs)
          # Instalar CloudWatch Agent  FIN #############################

  AplicacionInstance2:
    Type: AWS::EC2::Instance
    DependsOn:
      - PublicRouteIPv4
      - PublicSubnet2RouteTableAssociation
      - EFSMountTarget1
      - EFSMountTarget2
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: LabInstanceProfile
      SubnetId: !Ref PublicSubnet2
      PrivateIpAddress: !Sub '10.1${NN}.2.100'
      SecurityGroupIds:
        - !Ref AplicacionSecurityGroup
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 12
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${NN}-Aplicacion2'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          apt-get update -y
          apt-get upgrade -y

          # Instalar SSM Agent en Ubuntu
          snap install amazon-ssm-agent --classic
          systemctl enable snap.amazon-ssm-agent.amazon-ssm-agent.service
          systemctl start snap.amazon-ssm-agent.amazon-ssm-agent.service

          apt-get install apache2 nfs-common -y
          apt-get install php php-common libapache2-mod-php php-bz2 php-gd php-mysql \
          php-curl php-mbstring php-imagick php-zip php-common php-curl php-xml \
          php-json php-bcmath php-xml php-intl php-gmp zip unzip wget -y
          a2enmod env rewrite dir mime headers setenvif ssl
          systemctl restart apache2
          systemctl enable apache2

          #Descarga y descomprime la ultima version del Aplicacion
          #Se necesita un RDS para la bbdd
          cd /var/www/html
          rm /var/www/html/index.html
          git clone https://github.com/IESAlisal/SRIDTarea03.git .

          # Montar el EFS en data (compartido entre instancias) de forma persistente
          mkdir -p /var/www/html/data
          echo "${EFSFileSystem}.efs.${AWS::Region}.amazonaws.com:/ /var/www/html/data nfs4 nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport,_netdev 0 0" >> /etc/fstab
          mount -a

          chown -R www-data:www-data /var/www/html/

          # Configurar CloudWatch Logs
          LOG_GROUP="/ec2/ubuntu_app"
          REGION="us-east-1"
          cd /home/ubuntu
          # Instalar CloudWatch Agent  INICIO #############################
          # https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/download-CloudWatch-Agent-on-EC2-Instance-commandline-first.html
          wget https://amazoncloudwatch-agent.s3.amazonaws.com/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb
          dpkg -i amazon-cloudwatch-agent.deb
          rm amazon-cloudwatch-agent.deb
          
          # Crear configuracion del agente
          cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<EOF
          {
            "agent": {
              "region": "$REGION"
            },
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/var/log/syslog",
                      "log_group_name": "$LOG_GROUP",
                      "log_stream_name": "{instance_id}-syslog",
                      "timezone": "UTC"
                    },
                    {
                      "file_path": "/var/log/apache2/access.log",
                      "log_group_name": "$LOG_GROUP",
                      "log_stream_name": "{instance_id}-apache-access",
                      "timezone": "UTC"
                    },
                    {
                      "file_path": "/var/log/apache2/error.log",
                      "log_group_name": "$LOG_GROUP",
                      "log_stream_name": "{instance_id}-apache-error",
                      "timezone": "UTC"
                    }
                  ]
                }
              }
            }
          }
          EOF

          # Iniciar el agente
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
            -a fetch-config \
            -m ec2 \
            -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json \
            -s

          # Habilitar el servicio
          systemctl enable amazon-cloudwatch-agent
          systemctl restart amazon-cloudwatch-agent

          # IMPORTANTE
          # Para que funcione el agente de CloudWatch debes tener conectividad a los endpoints de CloudWatch Logs
          # Si estas en la red publica con IGW no hay problema
          # Si estas en una VPC privada con NAT-GATEWAY tampoco hay problema
          # Si estas en una VPC privada sin salida a Internet debes usar un ENDPOINT VPC
          # Si solo usas IPv6 sin NAT-GATEWAY debes abrir el puerto https ::0 en el grupo de seguridad entrante (y saliente si tienes reglas restrictivas)
          # Parece que da problemas con la resolucion DNS si no tienes IPv4
          # Debes usar un ENDPOINT IPv6 para CloudWatch en tu region (AWS Services y buscar logs)
          # Instalar CloudWatch Agent  FIN #############################

Outputs:
  VpcId:
    Description: 'ID de la VPC'
    Value: !Ref VPC
  PublicSubnet1Id:
    Description: 'ID de la subred publica 1'
    Value: !Ref PublicSubnet1
  PublicSubnet2Id:
    Description: 'ID de la subred publica 2'
    Value: !Ref PublicSubnet2
  PrivateSubnet1Id:
    Description: 'ID de la subred privada 1'
    Value: !Ref PrivateSubnet1
  PrivateSubnet2Id:
    Description: 'ID de la subred privada 2'
    Value: !Ref PrivateSubnet2
  AplicacionInstance1Id:
    Description: 'ID de la instancia 1'
    Value: !Ref AplicacionInstance1
  AplicacionInstance2Id:
    Description: 'ID de la instancia 2'
    Value: !Ref AplicacionInstance2
  AplicacionUrl1:
    Description: 'URL HTTP de la instancia 1'
    Value: !Sub 'http://${AplicacionInstance1.PublicIp}/'
  AplicacionUrl2:
    Description: 'URL HTTP de la instancia 2'
    Value: !Sub 'http://${AplicacionInstance2.PublicIp}/'
  EFSFileSystemId:
    Description: 'ID del sistema de archivos EFS'
    Value: !Ref EFSFileSystem
